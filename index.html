
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Selfie AR - Vivari Beach Club</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  body {
    margin:0; background:#000; overflow:hidden;
    font-family:Arial,sans-serif;
  }

  model-viewer {
    width:100vw;
    height:100vh;
    position:fixed;
    top:0; left:0;
    z-index:1;
  }

  #captureBtn, #switchCameraBtn {
    position:absolute;
    z-index:10;
    padding:20px 30px;
    border:none; border-radius:20px;
    background:#0b84ff; color:#fff;
    font-weight:bold; font-size:20px;
    cursor:pointer;
    box-shadow:0 6px 12px rgba(0,0,0,0.4);
  }

  #captureBtn {
    bottom:30px; left:50%; transform:translateX(-50%);
  }

  #switchCameraBtn {
    top:20px; right:20px;
  }

  #rotateHint {
    position:absolute;
    bottom:100px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    color:#fff; font-size:18px; font-weight:bold;
    background:rgba(0,0,0,0.4);
    padding:8px 12px; border-radius:8px;
  }

  @media (max-width:600px) {
    #captureBtn {
      padding:30px 40px;
      font-size:24px;
    }
    #rotateHint {
      font-size:16px;
      bottom:120px;
    }
  }
</style>
</head>
<body>

<!-- === MODEL VIEWER EM AR === -->
<model-viewer
  id="model"
  src="vivi.glb"
  alt="Vivi 3D"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  camera-controls
  auto-rotate
  environment-image="neutral"
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1.2"
  autoplay>
</model-viewer>

<!-- === ELEMENTOS DA INTERFACE === -->
<div id="rotateHint">⬅️ Arraste para girar a Vivi ➡️</div>
<button id="captureBtn">📸 Tirar Foto</button>
<button id="switchCameraBtn">🔄 Trocar Câmera</button>

<script>
  const modelViewer = document.getElementById('model');
  const captureBtn = document.getElementById('captureBtn');
  const switchCameraBtn = document.getElementById('switchCameraBtn');

  // Ativa AR automaticamente assim que possível
  window.addEventListener('load', async () => {
    try {
      if (modelViewer.canActivateAR) {
        await modelViewer.activateAR();
      }
    } catch (err) {
      console.warn("AR automático não disponível:", err);
    }
  });

  // Botão de captura (aviso para usar o botão nativo do AR)
  captureBtn.addEventListener('click', () => {
    alert('📸 Use o botão de foto do visualizador de AR para tirar a foto com a Vivi!');
  });

  // Troca de câmera (funciona apenas em AR suportado por WebXR)
  switchCameraBtn.addEventListener('click', async () => {
    try {
      if (modelViewer.canActivateAR) {
        await modelViewer.activateAR();
      } else {
        alert('Troca de câmera disponível apenas em dispositivos com WebXR.');
      }
    } catch (e) {
      console.warn('Erro ao alternar câmera:', e);
    }
  });
</script>

</body>
</html>
