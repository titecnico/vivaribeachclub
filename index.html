
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Vivi 3D - Realidade Aumentada</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #005ecb;
    }

    /* === BOTÃO AR DESTACADO === */
  #arBtn {
    background:linear-gradient(135deg, #0b84ff, #0059ff);
    padding:26px 60px;
    font-size:26px;
    border-radius:20px;
    animation: pulse 1.5s infinite alternate;
  }


  </style>
</head>
<body>

  <!-- Modelo 3D com AR -->
 <a href="#" id="btnAR"> <model-viewer
    id="modeloVivi"
    src="vivi.glb"
    alt="Modelo 3D Vivi"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    autoplay
    exposure="1"
    shadow-intensity="1"
    auto-rotate
    environment-image="neutral"
    style="background-color: transparent;"
  ></model-viewer></a>

  <!-- Botões -->
  <div id="controls">
    <button id="btnAR">👓 Ver em AR</button>
   <!-- <button id="btnFoto">📸 Tirar Foto</button> -->
  </div>

  <script>
    const modelViewer = document.getElementById('modeloVivi');
    const btnAR = document.getElementById('btnAR');
    const btnFoto = document.getElementById('btnFoto');

    // 🔹 Ativar AR automaticamente se suportado
    modelViewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'not-presenting') {
        btnAR.disabled = false;
      }
    });

    btnAR.addEventListener('click', () => {
      modelViewer.activateAR();
    });

    // 🔹 Captura de foto da cena (modo 3D)
    btnFoto.addEventListener('click', async () => {
      try {
        const canvas = modelViewer.renderedCanvas;
        const img = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = img;
        a.download = 'vivi_3d.png';
        a.click();
      } catch (e) {
        alert('Não foi possível capturar a imagem.');
        console.error(e);
      }
    });
  </script>

</body>
</html>
