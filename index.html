<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Selfie AR - Vivari Beach Club</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  body { margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #cameraVideo {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    object-fit:cover; z-index:0;
    pointer-events:none;
  }
  #modelContainer {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    z-index:1;
  }
  model-viewer {
    width:70%; height:70%;
    position:absolute; top:15%; left:15%;
    pointer-events:auto;
  }
  #controls {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:15px;
    z-index:10;
  }
  .btn {
    padding:24px 34px;
    border:none; border-radius:20px;
    background:#0b84ff; color:#fff; font-weight:bold; font-size:24px;
    cursor:pointer; box-shadow:0 6px 12px rgba(0,0,0,0.4);
  }
  #rotateHint {
    position:absolute; bottom:110px; left:50%; transform:translateX(-50%);
    z-index:10;
    color:#fff; font-size:18px; font-weight:bold;
    background:rgba(0,0,0,0.4); padding:8px 12px; border-radius:8px;
  }
  @media (max-width:600px) {
    .btn { padding:34px 46px; font-size:28px; }
    #rotateHint { font-size:16px; bottom:130px; }
  }
</style>
</head>
<body>

<!-- 📷 Câmera normal (modo selfie) -->
<video id="cameraVideo" autoplay playsinline muted></video>

<!-- 🐢 Vivi 3D com suporte AR -->
<div id="modelContainer">
  <model-viewer id="model" src="vivi.glb"
                alt="Vivi 3D"
                camera-controls
                disable-zoom
                disable-pan
                environment-image="neutral"
                shadow-intensity="1"
                shadow-softness="0.8"
                exposure="1.2"
                field-of-view="30deg"
                camera-orbit="0deg 75deg 2.5m"
                interaction-prompt="none"
                ar
                ar-modes="scene-viewer webxr quick-look"
                ar-scale="fixed"
                ar-placement="floor"
                ar-status="not-presenting">
  </model-viewer>
</div>

<!-- 💡 Texto guia -->
<div id="rotateHint">⬅️ Arraste para girar a Vivi ➡️</div>

<!-- 🎛️ Botões -->
<div id="controls">
  <button id="switchCamBtn" class="btn">🔄 Trocar Câmera</button>
  <button id="captureBtn" class="btn">📸 Tirar Selfie</button>
  <button id="arBtn" class="btn">🕶️ Ver em AR</button>
</div>

<script>
  const video = document.getElementById('cameraVideo');
  const modelViewer = document.getElementById('model');
  const arBtn = document.getElementById('arBtn');
  let useFrontCamera = true;
  let currentStream;

  // ======== Inicia câmera normal (modo selfie) ========
  async function startCamera() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
    }
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: useFrontCamera ? "user" : "environment" }
      });
      video.srcObject = currentStream;
      video.style.transform = useFrontCamera ? "scaleX(-1)" : "scaleX(1)";
    } catch (err) {
      alert("Erro ao acessar câmera: " + err);
    }
  }

  document.getElementById('switchCamBtn').addEventListener('click', () => {
    useFrontCamera = !useFrontCamera;
    startCamera();
  });

  // ======== Modo AR (Realidade Aumentada) ========
  arBtn.addEventListener('click', () => {
    if (modelViewer.canActivateAR) {
      modelViewer.activateAR(); // abre o modo AR nativo
    } else {
      alert("Seu dispositivo não suporta AR nativo 😢");
    }
  });

  // ======== Captura Selfie ========
  const captureBtn = document.getElementById('captureBtn');

  captureBtn.addEventListener('click', async () => {
    try {
      // snapshot da Vivi (modelo 3D)
      const modelSnapshot = await modelViewer.toDataURL();

      // cria canvas final
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      // desenha vídeo da câmera
      if (useFrontCamera) {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.setTransform(1,0,0,1,0,0);

      // desenha o modelo 3D capturado
      const imgModel = new Image();
      imgModel.onload = () => {
        ctx.drawImage(imgModel, canvas.width*0.15, canvas.height*0.15, canvas.width*0.7, canvas.height*0.7);

        // marca d’água Vivari
        ctx.font = `${Math.floor(canvas.height/18)}px Arial Black`;
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.textAlign = "center";
        ctx.fillText("Vivari Beach Club", canvas.width/2, canvas.height-40);

        // baixa a selfie
        const link = document.createElement('a');
        link.download = 'selfie_vivari.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      imgModel.src = modelSnapshot;

    } catch(err) {
      console.error("Erro ao capturar selfie:", err);
      alert("Erro ao capturar a selfie.");
    }
  });

  startCamera();
</script>

</body>
</html>
