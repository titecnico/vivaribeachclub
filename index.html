<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Selfie AR - Vivari Beach Club</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  body { margin:0; background:#000; overflow:hidden; font-family:Arial,sans-serif; }
  #cameraVideo {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    object-fit:cover; z-index:0;
    pointer-events:none;
  }
  #modelContainer {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    z-index:1;
  }
  model-viewer {
    width:80%;
    height:80%;
    position:absolute;
    top:10%;
    left:10%;
    pointer-events:auto;
    opacity:0.9;
  }
  #captureBtn, #switchCameraBtn {
    position:absolute;
    z-index:10;
    padding:20px 30px;
    border:none; border-radius:20px;
    background:#0b84ff; color:#fff; font-weight:bold; font-size:20px;
    cursor:pointer; box-shadow:0 6px 12px rgba(0,0,0,0.4);
  }
  #captureBtn {
    bottom:30px; left:50%; transform:translateX(-50%);
  }
  #switchCameraBtn {
    top:20px; right:20px;
  }
  #rotateHint {
    position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
    z-index:10;
    color:#fff; font-size:18px; font-weight:bold;
    background:rgba(0,0,0,0.4); padding:8px 12px; border-radius:8px;
  }
  .ar-button {
    position:absolute;
    bottom:100px;
    left:50%;
    transform:translateX(-50%);
    background:#0b84ff;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    padding:15px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 6px 12px rgba(0,0,0,0.4);
    z-index:10;
  }

  @media (max-width:600px) {
    #captureBtn {
      padding:30px 40px;
      font-size:24px;
    }
    #rotateHint {
      font-size:16px;
      bottom:120px;
    }
  }
</style>
</head>
<body>

<!-- Fundo com a câmera -->
<video id="cameraVideo" autoplay playsinline muted></video>

<!-- Modelo 3D -->
<div id="modelContainer">
  <model-viewer id="model"
    src="vivi.glb"
    ios-src="vivi.usdz"
    alt="Vivi 3D"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls
    environment-image="neutral"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.2"
    style="background:transparent;"
  >
    <button slot="ar-button" class="ar-button">
      👓 Ver em Realidade Aumentada
    </button>
  </model-viewer>
</div>

<!-- Dicas e botões -->
<div id="rotateHint">⬅️ Arraste para girar a Vivi ➡️</div>
<button id="captureBtn">📸 Tirar Selfie</button>
<button id="switchCameraBtn">🔄 Trocar Câmera</button>

<script>
  const video = document.getElementById('cameraVideo');
  const captureBtn = document.getElementById('captureBtn');
  const switchCameraBtn = document.getElementById('switchCameraBtn');
  const modelViewer = document.getElementById('model');
  let usingFrontCamera = true;
  let currentStream = null;

  // === Função para ligar a câmera (frontal/traseira) ===
  async function startCamera() {
    try {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }
      const constraints = { video: { facingMode: usingFrontCamera ? "user" : "environment" } };
      currentStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = currentStream;
      video.style.transform = usingFrontCamera ? "scaleX(-1)" : "scaleX(1)";
    } catch (err) {
      console.error('Erro ao acessar câmera:', err);
      alert('Erro ao acessar câmera: ' + (err.message || err));
    }
  }

  startCamera();

  // Alternar câmera
  switchCameraBtn.addEventListener('click', () => {
    usingFrontCamera = !usingFrontCamera;
    startCamera();
  });

  // === Capturar selfie (mistura câmera + modelo) ===
  captureBtn.addEventListener('click', async () => {
    try {
      const modelDataUrl = await modelViewer.toDataURL();
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');

      if (usingFrontCamera) {
        ctx.save();
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      } else {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      }

      const imgModel = new Image();
      imgModel.onload = () => {
        ctx.drawImage(imgModel, canvas.width*0.1, canvas.height*0.1, canvas.width*0.8, canvas.height*0.8);

        ctx.font = `${Math.floor(canvas.height/20)}px Arial`;
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.textAlign = "right";
        ctx.fillText("Vivari Beach Club", canvas.width-20, canvas.height-20);

        const link = document.createElement('a');
        link.download = 'selfie_vivi.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      imgModel.src = modelDataUrl;
    } catch (err) {
      console.error('Erro durante captura:', err);
      alert('Não foi possível capturar a selfie. ' + (err.message || ''));
    }
  });
</script>

</body>
</html>
