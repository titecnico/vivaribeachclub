<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Tartaruga 3D AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      model-viewer {
        width: 100%;
        height: 100%;
      }

      .photo-btn {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        color: #000;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        z-index: 20;
        transition: 0.3s;
      }

      .photo-btn:hover {
        background: #f0c93d;
      }

      canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="tartaruga3d"
      src="tartaruga.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      ar-scale="auto"
      camera-controls
      auto-rotate
      environment-image="neutral"
      shadow-intensity="1"
      shadow-softness="0.8"
      exposure="1.2"
      autoplay
      style="width: 100%; height: 100%;">
    </model-viewer>

    <button class="photo-btn" id="takePhoto">📸 Tirar Foto</button>

    <script>
      const takePhotoButton = document.getElementById('takePhoto');

      takePhotoButton.addEventListener('click', async () => {
        const canvas = await html2canvas(document.body, { useCORS: true });
        const image = canvas.toDataURL("image/png");
        const link = document.createElement('a');
        link.download = 'foto_tartaruga_ar.png';
        link.href = image;
        link.click();
      });
    </script>

    <!-- Biblioteca para capturar a tela -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  </body>
</html>
